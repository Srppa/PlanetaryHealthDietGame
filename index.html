<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Planetary Plate – sort the foods</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet">
  <style>
    /* =====================================================================
       1. ADJUSTABLE STYLE SETTINGS  (fonts, colours, spacing)
       ===================================================================== */
    :root {

      --plate-edge: #cfc6b2;
      /* darker outer edge of the plate rim */
      --plate-well: #e8e1d1;
      /* slightly darker inner part where the food lies */

      color-scheme: dark;

      /* ---- font sizes ---- */
      --font-title: clamp(40px, 7vw, 84px);
      /* "PLANETARY HEALTH DIET" */
      --font-subtitle: clamp(15px, 2vw, 24px);
      /* line under the title */
      --font-wheel-label: 16px;
      /* category names on wheel (SVG units) */
      --font-wheel-hint: 6px;
      /* small grey hint under them (SVG units) */
      --font-card-name: 14px;
      /* food name in the pool */
      --font-card-icon: 40px;
      /* food picture (emoji) in the pool */
      --font-placed-icon: 24px;
      /* pictures placed on wheel (SVG units) */
      --font-status: 16px;
      /* score + messages */

      /* ---- colours ---- */
      --bg: #1f4d3a;
      --bg-deep: #173c2d;
      --ink: #ffffff;
      --muted: #b9d3c6;
      --accent: #f7c922;
      --good: #7ddc8c;
      --bad: #ff6b5e;
      --plate: #f1ece0;

      /* ---- layout ---- */
      --pool-width: 380px;
      /* width of the food pool on the right */
      --card-min: 104px;
      /* minimum width of a food card */
      --gap: 24px;

      /* ---- info popup ---- */
      --popup-width: 460px;
      --font-popup-title: 28px;
      --font-popup-text: 16px;
      --font-popup-icon: 96px;
      /* emoji size, only used if the photo fails to load */
      --popup-photo-height: 400px;
      /* height of the Wikipedia photo */
    }

    /* ---- tutorial popup (info button) ---- */
    :root {
      --tutorial-width: 900px;
      /* popup width */
      --tutorial-green: #1f4d3a;
      /* header + step circles */
      --tutorial-note-bg: #e6f0e7;
      /* side boxes */
      --font-tutorial-title: 32px;
      --font-tutorial-text: 16px;
      --font-tutorial-note: 13px;
    }

    * {
      -webkit-user-select: none;
      /* Safari */
      -ms-user-select: none;
      /* Internet Explorer/Edge */
      user-select: none;
    }

    /* a wider, white popup, only when it contains the tutorial */
    dialog#popup:has(.tutorial) {
      width: min(var(--tutorial-width), calc(100vw - 32px));
      background: #fff;
      overflow: auto;
    }

    dialog#popup:has(.tutorial) #popupBody {
      padding: 0;
    }

    dialog#popup:has(.tutorial) .popup-close {
      color: #fff;
    }

    #popupBody .tutorial {
      color: #1b2a22;
      font-size: var(--font-tutorial-text);
    }

    .t-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      padding: 18px 56px 16px 24px;
      background: var(--tutorial-green);
      color: #fff;
    }

    .t-header small {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    #popupBody .tutorial h2 {
      margin: 2px 0 0;
      font-family: "Inter", sans-serif;
      font-size: var(--font-tutorial-title);
      font-weight: 800;
      text-transform: none;
      color: #fff;
    }

    .t-time {
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
    }

    .t-body {
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 28px;
      padding: 22px 24px 28px;
    }

    @media (max-width: 700px) {
      .t-body {
        grid-template-columns: 1fr;
      }
    }

    #popupBody .t-goal {
      margin: 0 0 20px;
      color: #1b2a22;
    }

    #popupBody .t-steps {
      list-style: none;
      margin: 0;
      padding: 0;
      color: inherit;
    }

    .t-step {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .t-num {
      flex: 0 0 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--tutorial-green);
      color: #fff;
      font-weight: 700;
      display: grid;
      place-items: center;
    }

    .t-note {
      background: var(--tutorial-note-bg);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 12px;
      font-size: var(--font-tutorial-note);
      line-height: 1.45;
    }

    .t-note.dashed {
      background: transparent;
      border: 1.5px dashed #5aa35f;
    }

    .t-star {
      color: #e8a317;
    }

    /* =====================================================================
       2. PAGE LAYOUT
       ===================================================================== */
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, sans-serif;
      overflow: hidden;
    }

    header {
      text-align: center;
      height: 20vh;
    }

    h1 {
      margin: 0;
      padding-top: 50px;
      font-family: "Archivo Black", Impact, sans-serif;
      font-size: var(--font-title);
      line-height: .95;
      text-transform: uppercase;
    }

    .subtitle {
      margin: 16px auto 0;
      font-size: var(--font-subtitle);
    }

    .subtitle b {
      color: var(--accent);
      font-weight: 700;
    }

    .subtitle br {
      margin-bottom: 5px;
    }


    /* ---- info button (top left) ---- */
    .info-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--muted);
      background: transparent;
      color: var(--ink);
      font: 700 20px "Archivo Black", Impact, sans-serif;
      cursor: pointer;
    }

    .info-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #1b2a22;
    }

    .info-btn:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    /* lists inside any popup (tutorial, group info) */
    #popupBody ul,
    #popupBody ol {
      margin: 8px 0;
      padding-left: 1.3em;
      color: var(--muted);
    }

    main {
      display: flex;
      padding: 16px var(--gap) 40px;
      max-width: 100%;
      max-height: 80vh;
      margin: 0 auto;
      align-items: start;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    /* ---- info popup (double-click a food or a section) ---- */
    .card,
    .wedge {
      touch-action: manipulation;
    }

    dialog#popup {
      width: 40%;
      padding: 0;
      border: 0;
      border-radius: 20px;
      background: var(--bg-deep);
      color: var(--ink);
      font-size: var(--font-popup-text);
      line-height: 1.5;
    }

    dialog#popup::backdrop {
      background: rgba(0, 0, 0, .6);
    }

    #popupBody {
      padding: 35px;
    }

    #popupBody h2 {
      margin: 20px 0 8px;
      font-family: "Archivo Black", Impact, sans-serif;
      font-size: var(--font-popup-title);
      line-height: 1.1;
      text-transform: uppercase;
    }

    #popupBody p {
      margin: 8px 0;
      color: var(--muted);
    }

    .popup-close {
      position: absolute;
      top: 2px;
      right: 9px;
      background: none;
      border: 0;
      color: var(--ink);
      font-size: 30px;
      cursor: pointer;
    }

    .popup-food {
      text-align: center;
    }

    .popup-icon {
      font-size: var(--font-popup-icon);
      line-height: 1.1;
    }

    .popup-photo {
      width: 100%;
      height: var(--popup-photo-height);
      object-fit: cover;
      border-radius: 14px;
      background: var(--plate);
    }

    /* ---- group info popup (double-click a section) ---- */
    :root {
      --group-width: 600px;
      /* popup width */
      --font-group-text: 15px;
      /* body text */
      --font-group-stat: 26px;
      /* big numbers in the tiles */
      --font-group-small: 13px;
      /* tile captions + source line */
    }

    dialog#popup:has(.group-info) {
      width: min(var(--group-width), calc(100vw - 32px));
    }

    #popupBody .group-info {
      font-size: var(--font-group-text);
      line-height: 1.5;
    }

    #popupBody .group-info h2 {
      border-left: 8px solid var(--g-color);
      padding: 2px 32px 2px 12px;
    }

    #popupBody .group-info h3 {
      margin: 18px 0 4px;
      font-size: 17px;
      color: var(--ink);
    }

    #popupBody .group-info p {
      margin: 6px 0;
    }

    #popupBody .g-lead {
      color: var(--ink);
    }

    .g-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 16px 0 8px;
    }

    .g-stat {
      background: rgba(255, 255, 255, .07);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .g-stat b {
      display: block;
      font-size: var(--font-group-stat);
      line-height: 1.1;
      color: var(--accent);
    }

    .g-stat span {
      display: block;
      margin-top: 4px;
      font-size: var(--font-group-small);
      line-height: 1.3;
      color: var(--muted);
    }

    .g-bar {
      height: 8px;
      margin: 4px 0 6px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .12);
      overflow: hidden;
    }

    .g-bar span {
      display: block;
      height: 100%;
      min-width: 4px;
      background: var(--g-color);
      border-radius: inherit;
    }

    #popupBody .group-info ul {
      margin: 4px 0;
      padding-left: 1.2em;
      color: var(--muted);
    }

    .group-info li {
      margin: 4px 0;
    }

    .group-info li b {
      color: var(--ink);
    }

    #popupBody .g-tip {
      display: none;

      margin-top: 14px;
      padding: 8px 12px;
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      background: rgba(247, 201, 34, .12);
      color: var(--ink);
    }

    #popupBody .g-source {
      display: none;

      margin-top: 14px;
      font-size: var(--font-group-small);
      opacity: .75;
    }

    @media (max-width: 520px) {
      .g-stats {
        grid-template-columns: 1fr 1fr;
      }
    }

    /* ---- climate class row in the food popup ---- */
    :root {
      --class-a: #2e9e4f;
      --class-b: #8bc34a;
      --class-c: #f2d03b;
      --class-d: #f29a38;
      --class-e: #e5533d;
      --climate-badge-size: 48px;
      --font-climate: 14px;
    }

    .climate {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 20px;
      text-align: left;
      font-size: var(--font-climate);
    }

    .climate-badge {
      flex: 0 0 var(--climate-badge-size);
      height: var(--climate-badge-size);
      border-radius: 10px;
      display: grid;
      place-items: center;
      font: 800 26px "Inter", sans-serif;
      color: #3a2e0b;
    }

    .climate-badge.class-a {
      background: var(--class-a);
    }

    .climate-badge.class-b {
      background: var(--class-b);
    }

    .climate-badge.class-c {
      background: var(--class-c);
    }

    .climate-badge.class-d {
      background: var(--class-d);
    }

    .climate-badge.class-e {
      background: var(--class-e);
    }

    .climate-label b {
      color: var(--ink);
    }

    .portion {
      display: none;

      margin-top: 0px;
      text-align: center;
      font-size: var(--font-climate);
      color: var(--muted);
    }

    /* ---- language switch ---- */
    .lang {
      position: absolute;
      top: 20px;
      right: 0;
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin: 0 auto;
      padding: 0 var(--gap);
    }

    .lang button {
      padding: 6px 14px;
      border-radius: 999px;
      border: 2px solid var(--muted);
      background: transparent;
      color: var(--ink);
      font: 700 14px "Inter", sans-serif;
      cursor: pointer;
    }

    .lang button[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #1b2a22;
    }

    .lang button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    /* ---- wheel ---- */
    #wheel {
      width: 75%;
      max-height: 50%;
      margin-left: -75px;
      height: auto;
      display: block;
    }

    .wedge {
      cursor: pointer;
      transition: filter .15s;
    }

    .wedge:hover,
    .wedge.hover {
      filter: brightness(1.18);
    }

    .wedge.flash-bad {
      animation: flash-bad .5s;
    }

    .wedge.flash-good {
      animation: flash-good .5s;
    }

    @keyframes flash-bad {
      40% {
        fill: var(--bad);
      }
    }

    @keyframes flash-good {
      40% {
        fill: var(--good);
      }
    }

    /* ---- category labels (built from the HTML template in CONFIG.labelTemplate) ---- */
    .label-object {
      pointer-events: none;
      overflow: visible;
    }

    .label-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .label-name {
      font-size: var(--font-wheel-label);
      font-weight: 800;
      line-height: 1.15;
      color: var(--ink);
    }

    .label-hint {
      font-size: var(--font-wheel-hint);
      line-height: 1.3;
      margin-top: 2px;
      color: var(--muted);
    }

    .label-hint:empty {
      display: none;
    }

    /* Style one category on its own using its id, e.g.:  .label-dairy .label-name { color: var(--accent); } */
    .placed {
      font-size: var(--font-placed-icon);
      pointer-events: none;
    }

    /* ---- pool ---- */
    aside {
      background: var(--bg-deep);
      border-radius: 20px;
      padding: 16px;
    }

    .status {
      display: flex;
      justify-content: space-between;
      font-size: var(--font-status);
      margin-bottom: 8px;
    }

    .status b {
      color: var(--accent);
    }

    #message {
      min-height: 1.5em;
      font-size: var(--font-status);
      color: var(--muted);
      margin: 0 0 12px;
    }

    #message.good {
      color: var(--good);
    }

    #message.bad {
      color: var(--bad);
    }

    #pool {
      display: grid;
      gap: 10px;
      max-height: 56vh;
      overflow-y: auto;
      padding: 2px;
      padding-right: 15px;
      grid-template-columns: repeat(3, 1fr);
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: var(--plate);
      color: #1b2a22;
      border: 3px solid transparent;
      border-radius: 14px;
      padding: 10px 6px;
      cursor: grab;
      font: inherit;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .card:focus-visible,
    .card.selected {
      outline: none;
      border-color: var(--accent);
    }

    .card .icon {
      font-size: var(--font-card-icon);
      line-height: 1;
    }

    .card .name {
      font-size: var(--font-card-name);
      font-weight: 600;
      text-align: center;
    }

    .card.shake {
      animation: shake .4s;
    }

    @keyframes shake {
      25% {
        transform: translateX(-6px);
      }

      75% {
        transform: translateX(6px);
      }
    }

    button.restart {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #1b2a22;
      font: 700 15px "Inter", sans-serif;
      cursor: pointer;
    }

    /* confetti layer (drawn by JS, never blocks clicks) */
    #confetti {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <header>
    <button class="info-btn" id="infoBtn" aria-label="Info / Nápověda">i</button>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en">EN</button>
      <button data-lang="cs">CZ</button>
    </div>
    <h1 id="title">Planetary<br>Health Diet</h1>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <main>
    <svg id="wheel" role="img" aria-label="Plate divided into food groups"></svg>

    <aside>
      <div class="status">
        <span><span id="lblSorted">Sorted</span> <b id="placedCount">0</b> / <b id="totalCount">0</b></span>
        <span><span id="lblMistakes">Mistakes</span> <b id="mistakes">0</b></span>
      </div>
      <p id="message"></p>
      <div id="pool"></div>
      <button class="restart" id="restart">Start over</button>
    </aside>
  </main>

  <dialog id="popup">
    <button class="popup-close" aria-label="Close / Zavřít">&times;</button>
    <div id="popupBody"></div>
  </dialog>

  <script>
    /* =====================================================================
       3. ADJUSTABLE GAME SETTINGS
       ===================================================================== */
    const CONFIG = {
      wheelRadius: 150,      // size of the plate (SVG units)
      plateRim: 5,           // cream border around the plate
      marginX: 280,          // empty space left/right of the plate, used for labels
      marginY: 90,           // empty space above/below the plate
      labelDistance: 50,     // how far the labels sit from the plate edge (try 26 for close, 90 for far)
      showLeaderLines: true, // draw a thin line from each section to its label
      leaderLineWidth: 2,    // thickness of that line
      labelPadding: 8,       // small gap between the end of the line and the text
      startAngle: -45,       // rotates the whole plate, in degrees. 0 = first section starts at the top, positive = clockwise
      showPlacedFoods: true,

      plateRim: 24,          // width of the plate's rim around the food (SVG units)
      plateShadow: 0.35,     // darkness of the shadow under the plate (0 = none, 1 = black)
      plateGloss: false,      // light reflection on the rim


      // ---- label template ----
      // Every category label is built from this HTML. Placeholders:
      //   {label} translated name   {hint} translated hint (empty if showHints is false)
      //   {id} category id (use it for per-category CSS classes)
      // A category can override it with its own `template: "..."` field in CATEGORIES.
      labelTemplate: `
    <div class="label-box label-{id}">
      <div class="label-name">{label}</div>
      <div class="label-hint">{hint}</div>
    </div>`,
      labelWidth: 260,       // size of the label box (SVG units); text wraps inside it
      labelHeight: 70,
      dividerWidth: 3,       // thin gap line between sections
      showHints: true,       // show the small grey description under each label
      defaultLanguage: "auto", // "en", "cs", or "auto" (Czech if the browser is set to Czech)
      doubleClickDelay: 250, // ms to wait after a click on a section, so a double-click opens the popup instead of placing a food

      // ---- food data ----
      csvUrl: "",            // optional: path/URL of a CSV file to load instead of the embedded one (needs a web server, e.g. "sustainable_foods_czech.csv")
      popupImageWidth: 600,  // width (px) requested from Wikipedia for the popup photo; smaller = faster

      // how placed food pictures are arranged inside a section
      placedStartRadius: 0.86, // first picture sits at 86 % of the radius
      placedRowStep: 0.11,     // each next row moves 11 % of the radius inward
      twoColumnsAbove: 40,     // sections wider than this (degrees) use 2 columns
      placedFill: 0.8,         // in narrow sections an icon may take up to 90 % of the section width (lower = smaller icons there)
      placedMinScale: 0.35,    // icons never shrink below 35 % of --font-placed-icon
    };

    /* =====================================================================
       4. CATEGORIES  –  edit `degrees` to resize a section.
       Order = clockwise, starting at the top. Degrees should add up to 360
       (they are scaled automatically if they don't).
       The `id` must match the `category` column of the CSV.
       ===================================================================== */
    const CATEGORIES = [
      { id: "grains", label: "Whole Grains", hint: "", degrees: 60, color: "#c79a5b" },
      { id: "starchy", label: "Starchy Vegetables", hint: "", degrees: 10, color: "#b98b4a" },
      { id: "oils", label: "Unsaturated Plant Oils", hint: "", degrees: 15, color: "#8fa14a" },
      { id: "animal", label: "Animal Protein", hint: "", degrees: 15, color: "#b4684f" },
      { id: "dairy", label: "Dairy Foods", hint: "", degrees: 25, color: "#e3cf98" },
      { id: "plant", label: "Plant Protein", hint: "", degrees: 50, color: "#9a6b3f" },
      { id: "sugarsalt", label: "With added Sugars & Salt", hint: "", degrees: 5, color: "#6a8fb0" },
      { id: "veg", label: "Vegetables & Fruits", hint: "", degrees: 180, color: "#5e9a4f" },

    ];

    /* =====================================================================
       5. FOOD DATABASE  –  ONE CSV for everything about the foods
       Columns: name, czech_name, emoji, category, additional_info,
                czech_additional_info, wikipedia_image_url
       - emoji = picture on the cards and on the plate
       - wikipedia_image_url = photo in the popup (falls back to the emoji)
       Replace the text between the backticks with your own CSV, or set
       CONFIG.csvUrl to load a CSV file instead.
       ===================================================================== */
    const FOODS_CSV = `
name,czech_name,emoji,category,additional_info,czech_additional_info,wikipedia_image_url,climate_class,climate_co2_g,portion_g
Broccoli,Brokolice,🥦,veg,"A green vegetable full of vitamin C, vitamin K and folate, with plenty of fibre and very few calories. Low footprint, especially when it is in season and grown nearby.","Zelená zelenina plná vitaminu C, vitaminu K a kyseliny listové, s velkým množstvím vlákniny a velmi malým množstvím kalorií. Má nízkou ekologickou stopu, hlavně když je sezónní a vypěstovaná nablízku.",images/foods/broccoli.jpg,A,40,80
Carrot,Mrkev,🥕,veg,"A crunchy orange root that is mostly water and fibre, with very little starch. Its colour comes from beta-carotene, which the body turns into vitamin A. It has one of the lowest footprints of all foods and keeps well through winter.","Křupavý oranžový kořen, který je hlavně z vody a vlákniny a škrobu obsahuje jen velmi málo. Barvu mu dává beta-karoten, ze kterého si tělo vyrábí vitamin A. Patří k potravinám s nejnižší stopou a dobře vydrží přes zimu.",images/foods/carrot.jpg,A,30,80
Apple,Jablko,🍎,veg,"A fruit with fibre (pectin) and vitamin C – a perfect snack. Apples grow well in Czechia and keep for months, so they rarely need long transport.","Ovoce s vlákninou (pektinem) a vitaminem C – ideální svačina. Jablka se v Česku dobře pěstují a vydrží měsíce, takže je obvykle není nutné dovážet zdaleka.",images/foods/apple.jpg,A,60,150
Strawberries,Jahody,🍓,veg,"Juicy berries packed with vitamin C and antioxidants; their sweetness is natural fruit sugar, not added sugar. Low footprint in summer, but out of season they may come from heated greenhouses or by plane, which raises it a lot.","Šťavnaté plody plné vitaminu C a antioxidantů; jejich sladkost je přirozený ovocný cukr, ne přidaný. V létě mají nízkou stopu, mimo sezónu ale mohou pocházet z vytápěných skleníků nebo z letadla, a pak je stopa mnohem vyšší.",images/foods/strawberries.jpg,B,190,125
Tomato,Rajče,🍅,veg,"Botanically a fruit, eaten as a vegetable. It gives vitamin C, potassium and lycopene, a red pigment that works as an antioxidant. Outdoor summer tomatoes have a low footprint; winter ones from heated greenhouses a much higher one.","Botanicky je to plod, jíme ho ale jako zeleninu. Dodává vitamin C, draslík a lykopen, červené barvivo s antioxidačními účinky. Letní rajčata z pole mají nízkou stopu, zimní z vytápěných skleníků mnohem vyšší.",images/foods/tomato.jpg,B,170,80
Eggplant,Lilek,🍆,veg,"A purple vegetable with fibre and very few calories; when cooked it soaks up flavours (and oil). Usually a low footprint, higher when grown in heated greenhouses.","Fialová zelenina s vlákninou a velmi malým množstvím kalorií; při vaření nasává chutě (i olej). Obvykle má nízkou stopu, vyšší při pěstování ve vytápěných sklenících.",images/foods/eggplant.jpg,A,50,100
Orange,Pomeranč,🍊,veg,"A citrus fruit famous for vitamin C, with fibre and folate too. The whole fruit gives you more fibre than juice. Low footprint, even though it travels a long way to Czechia.","Citrusový plod známý vitaminem C, obsahuje také vlákninu a kyselinu listovou. Celý plod dá víc vlákniny než džus. Má nízkou stopu, i když do Česka cestuje zdaleka.",images/foods/orange.jpg,A,45,150
Leafy greens,Listová zelenina,🥬,veg,"Spinach, lettuce or kale give folate, vitamin K, iron and calcium with almost no calories – dark green leaves are among the most nutritious foods per bite. Low footprint in season; heated greenhouses raise it.","Špenát, salát nebo kadeřávek dodávají kyselinu listovou, vitamin K, železo a vápník téměř bez kalorií – tmavě zelené listy patří k nejvýživnějším potravinám vůbec. V sezóně mají nízkou stopu, vytápěné skleníky ji zvyšují.",images/foods/leafy-greens.jpg,A,40,80
Whole-wheat bread,Celozrnný pšeničný chléb,🍞,grains,"Baked from flour that keeps the whole grain (bran and germ), so it gives slow-release energy from complex carbohydrates, plus fibre, B vitamins, iron and magnesium. Wheat has a low footprint; most of it comes from fertilizer.","Peče se z mouky z celého zrna (včetně otrub a klíčku), takže dodává pozvolna uvolňovanou energii ze složených sacharidů, vlákninu, vitaminy B, železo a hořčík. Pšenice má nízkou stopu, většina pochází z hnojiv.",images/foods/whole-wheat-bread.jpg,A,85,60
Brown rice,Hnědá rýže,🍚,grains,"A cereal grain that keeps its bran layer, so it has more fibre, magnesium and B vitamins than white rice; its energy comes mainly from starch. Rice has a higher footprint than other grains because flooded paddy fields release methane.","Obilnina, která si ponechává obalovou vrstvu (otruby), proto má víc vlákniny, hořčíku a vitaminů B než bílá rýže; energii dodává hlavně škrob. Rýže má vyšší stopu než jiné obiloviny, protože zaplavená rýžová pole uvolňují metan.",images/foods/brown-rice.jpg,B,330,75
Corn,Kukuřice,🌽,grains,"Maize is a cereal grain: whole kernels, polenta or popcorn give energy from starch, plus fibre and B vitamins. Low footprint, but much of the world's maize is grown as animal feed, not food for people.","Kukuřice je obilnina: celá zrna, polenta nebo popcorn dodávají energii ze škrobu, vlákninu a vitaminy B. Má nízkou stopu, velká část světové kukuřice se ale pěstuje jako krmivo pro zvířata, ne jako jídlo pro lidi.",images/foods/corn.jpg,A,70,100
Oatmeal,Ovesná kaše,🥣,grains,"Made from whole oat grains. Oats contain beta-glucan, a fibre that helps lower cholesterol and keeps you full for a long time. A low-footprint grain that grows well in Czechia.","Vyrábí se z celých ovesných zrn. Oves obsahuje beta-glukan, vlákninu, která pomáhá snižovat cholesterol a zasytí na dlouho. Je to obilnina s nízkou stopou, která se v Česku dobře pěstuje.",images/foods/oatmeal.jpg,A,125,50
Whole-grain pasta,Celozrnné těstoviny,🍝,grains,Pasta from whole-grain wheat flour: energy from complex carbohydrates and about twice the fibre of white pasta. Low footprint; the main impact is fertilizer for the wheat.,"Těstoviny z celozrnné pšeničné mouky: energie ze složených sacharidů a zhruba dvakrát víc vlákniny než bílé těstoviny. Mají nízkou stopu, hlavní dopad mají hnojiva při pěstování pšenice.",images/foods/whole-grain-pasta.jpg,A,120,75
Potato,Brambory,🥔,starchy,"A tuber that stores its energy as starch. It also gives vitamin C and potassium, and most of its fibre is in the skin. Boiled or baked is better than fried. Very low footprint: potatoes give a lot of food from a small field.","Hlíza, která si zásoby energie ukládá ve formě škrobu. Dodává také vitamin C a draslík, většina vlákniny je ve slupce. Lepší vařené nebo pečené než smažené. Má velmi nízkou stopu: z malého pole dají hodně jídla.",images/foods/potato.jpg,A,60,200
Sweet potato,Batáty,🍠,starchy,"A sweet-tasting root full of starch; its orange flesh is rich in beta-carotene (vitamin A), with fibre and potassium too. Low footprint, but in Czechia it is mostly imported.","Sladce chutnající kořen plný škrobu; oranžová dužina je bohatá na beta-karoten (vitamin A), obsahuje i vlákninu a draslík. Má nízkou stopu, do Česka se ale většinou dováží.",images/foods/sweet-potato.jpg,A,45,150
Cassava,Maniok,🫚,starchy,"A tropical root that is almost pure starch with very little protein. It must always be cooked, because raw cassava is poisonous. It is a staple for hundreds of millions of people and grows even in poor soil.","Tropický kořen, který je téměř čistý škrob a obsahuje velmi málo bílkovin. Vždy se musí tepelně upravit, protože syrový maniok je jedovatý. Je základní potravinou stovek milionů lidí a roste i na chudé půdě.",images/foods/cassava.jpg,B,150,150
Beans,Fazole,🫘,plant,"A legume packed with protein and fibre, plus iron, zinc and folate. Bean plants take nitrogen from the air, so they need little fertilizer – one of the most climate-friendly protein sources.","Luštěnina plná bílkovin a vlákniny, navíc obsahuje železo, zinek a kyselinu listovou. Fazole si berou dusík ze vzduchu, takže potřebují málo hnojiv – patří k nejšetrnějším zdrojům bílkovin.",images/foods/beans.jpg,A,110,60
Peanuts,Arašídy,🥜,plant,"Despite the name, peanuts are legumes, not nuts. They are rich in protein, unsaturated fat, vitamin E and magnesium; a handful (30 g) is a good portion. Low footprint compared with animal protein.","Přestože se jim říká oříšky, arašídy jsou luštěniny. Jsou bohaté na bílkoviny, nenasycené tuky, vitamin E a hořčík; hrst (30 g) je dobrá porce. Ve srovnání s živočišnými bílkovinami mají nízkou stopu.",images/foods/peanuts.jpg,A,95,30
Walnuts,Vlašské ořechy,🌰,plant,"Nuts with protein, fibre and healthy unsaturated fats, including plant omega-3 fatty acids. Walnut trees grow well in Czechia and store carbon for decades, so local walnuts have a very low footprint.","Ořechy s bílkovinami, vlákninou a zdravými nenasycenými tuky včetně rostlinných omega-3 mastných kyselin. Ořešáky v Česku dobře rostou a desítky let ukládají uhlík, takže místní vlašské ořechy mají velmi nízkou stopu.",images/foods/walnuts.jpg,A,9,30
Edamame,Edamame,🫛,plant,"Young green soybeans in the pod. Soy is a legume with complete protein (all essential amino acids), plus fibre, iron and folate. Low footprint – although most soy grown worldwide ends up as animal feed.","Mladé zelené sójové boby v luscích. Sója je luštěnina s plnohodnotnou bílkovinou (obsahuje všechny esenciální aminokyseliny), k tomu vlákninu, železo a kyselinu listovou. Má nízkou stopu – většina sóji na světě ale skončí jako krmivo pro zvířata.",images/foods/edamame.jpg,B,160,80
Olive oil,Olivový olej,🫒,oils,"Pressed from olives; mostly monounsaturated fat, which helps keep blood cholesterol healthy, plus vitamin E. The key fat of the Mediterranean diet. Olive groves can use a lot of water in dry regions.","Lisuje se z oliv; obsahuje hlavně mononenasycené tuky, které pomáhají udržet zdravou hladinu cholesterolu, a vitamin E. Je hlavním tukem středomořské stravy. Olivové háje mohou v suchých oblastech spotřebovat hodně vody.",images/foods/olive-oil.jpg,A,90,15
Sunflower oil,Slunečnicový olej,🌻,oils,Pressed from sunflower seeds; rich in polyunsaturated fat (omega-6) and vitamin E. It is liquid at room temperature because it has little saturated fat. Sunflowers grow in Czechia too; the impact comes mainly from fertilizer and pesticides.,"Lisuje se ze slunečnicových semen; je bohatý na polynenasycené tuky (omega-6) a vitamin E. Při pokojové teplotě je tekutý, protože obsahuje málo nasycených tuků. Slunečnice roste i v Česku; dopad souvisí hlavně s hnojivy a pesticidy.",images/foods/sunflower-oil.jpg,A,55,15
Rapeseed oil,Řepkový olej,🌼,oils,"Pressed from the seeds of rapeseed, the bright yellow crop in Czech fields. It has very little saturated fat and contains plant omega-3 fatty acids. A local oil with a relatively low footprint; the main impact is fertilizer.","Lisuje se ze semen řepky, kterou znáš ze žlutých polí v Česku. Obsahuje velmi málo nasycených tuků a má rostlinné omega-3 mastné kyseliny. Je to místní olej s relativně nízkou stopou; hlavní dopad mají hnojiva.",images/foods/rapeseed-oil.jpg,A,55,15
Candy,Bonbony,🍬,sugarsalt,"Almost pure sugar with flavourings and colours: lots of energy but no fibre, vitamins or protein (""empty calories""). A few sweets can use up the whole daily limit of about 30 g of added sugar. The impact comes from sugar crops, processing and packaging.","Téměř čistý cukr s aromaty a barvivy: hodně energie, ale žádná vláknina, vitaminy ani bílkoviny („prázdné kalorie“). Pár bonbonů může vyčerpat celý denní limit zhruba 30 g přidaného cukru. Dopad souvisí s pěstováním cukrové řepy či třtiny, zpracováním a obaly.",images/foods/candy.jpg,A,120,30
Donut,Kobliha,🍩,sugarsalt,"White-flour dough fried in fat and covered with sugar glaze or filling: lots of added sugar and fat, little fibre. A treat, not an everyday food. Eggs, milk and frying fat add to its footprint.","Těsto z bílé mouky smažené v tuku, s cukrovou polevou nebo náplní: hodně přidaného cukru a tuku, málo vlákniny. Je to pamlsek, ne každodenní jídlo. Vejce, mléko a tuk na smažení zvyšují jeho stopu.",images/foods/donut.jpg,B,210,60
Soda,Slazená limonáda,🥤,sugarsalt,"A sweetened soft drink: one 330 ml can has about 35 g of sugar – more than the whole daily limit for added sugar (about 30 g). Sugary drinks are linked to weight gain, type 2 diabetes and tooth decay, and cans and bottles add packaging waste.","Slazený nápoj: jedna plechovka (330 ml) obsahuje zhruba 35 g cukru – víc než celý denní limit přidaného cukru (asi 30 g). Slazené nápoje souvisejí s přibýváním na váze, cukrovkou 2. typu a zubním kazem a plechovky a lahve navíc vytvářejí odpad z obalů.",images/foods/soda.jpg,B,150,330
Fish,Ryby,🐟,animal,"High-quality protein, vitamin D, iodine and especially omega-3 fatty acids, which support the brain and heart. About two portions a week are recommended. The footprint depends a lot on the species and on how it was caught or farmed.","Plnohodnotné bílkoviny, vitamin D, jód a hlavně omega-3 mastné kyseliny, které podporují mozek a srdce. Doporučují se asi dvě porce týdně. Stopa hodně závisí na druhu ryby a na tom, jak byla ulovena nebo chována.",images/foods/fish.jpg,C,640,125
Chicken,Kuřecí maso,🍗,animal,"Lean meat with complete protein and B vitamins (B3, B6); the planetary health diet suggests about two portions of poultry a week. Lower footprint than beef, but still much higher than beans or lentils, because chickens need feed.","Libové maso s plnohodnotnou bílkovinou a vitaminy B (B3, B6); planetární strava doporučuje asi dvě porce drůbeže týdně. Má nižší stopu než hovězí, ale stále mnohem vyšší než fazole nebo čočka, protože kuřata potřebují krmivo.",images/foods/chicken.jpg,C,760,125
Beef,Hovězí maso,🥩,animal,"Red meat with protein, easily absorbed iron, zinc and vitamin B12, but also saturated fat; eating a lot of red meat is linked to heart disease and type 2 diabetes, so about one portion a week is the most recommended. Cattle burp methane and need lots of land: beef has the highest footprint on the list.","Červené maso s bílkovinami, dobře vstřebatelným železem, zinkem a vitaminem B12, ale i s nasycenými tuky; vysoká spotřeba červeného masa souvisí s nemocemi srdce a cukrovkou 2. typu, proto se doporučuje nejvýše asi jedna porce týdně. Skot vypouští metan a potřebuje hodně půdy: hovězí má nejvyšší stopu ze všech potravin v seznamu.",images/foods/beef.jpg,E,7500,125
Eggs,Vejce,🥚,animal,"Small but rich in high-quality protein, vitamin B12, vitamin D and choline; the planetary health diet counts about two eggs a week. The footprint is moderate: lower than meat, higher than most plant proteins, mostly because of hen feed.","Malá, ale bohatá na plnohodnotné bílkoviny, vitamin B12, vitamin D a cholin; planetární strava počítá asi se dvěma vejci týdně. Stopa je střední: nižší než u masa, vyšší než u většiny rostlinných bílkovin, hlavně kvůli krmivu pro slepice.",images/foods/eggs.jpg,C,470,100
Shrimp,Krevety,🦐,animal,"Seafood with lean protein, iodine and selenium and very little fat. The footprint varies a lot: some shrimp farms replace mangrove forests, and bottom trawling damages the seabed and burns a lot of fuel.","Mořské plody s libovou bílkovinou, jódem a selenem a velmi malým množstvím tuku. Stopa se hodně liší: kvůli některým krevetím farmám mizí mangrovové lesy a vlečné sítě poškozují mořské dno a spotřebují hodně paliva.",images/foods/shrimp.jpg,D,1180,100
Milk,Mléko,🥛,dairy,"A drink from cows (or goats and sheep) rich in calcium for bones and teeth, plus protein, vitamins B2 and B12 and iodine. About one glass of milk or its equivalent a day is enough. Dairy cows release methane, so milk has a higher footprint than plant drinks.","Nápoj od krav (nebo koz a ovcí) bohatý na vápník pro kosti a zuby, k tomu bílkoviny, vitaminy B2 a B12 a jód. Stačí asi jedna sklenice mléka nebo jeho ekvivalent denně. Dojnice vypouštějí metan, proto má mléko vyšší stopu než rostlinné nápoje.",images/foods/milk.jpg,C,800,250
Cheese,Sýr,🧀,dairy,"Concentrated milk: about 10 litres of milk make 1 kg of hard cheese, so it is rich in calcium and protein, but also in saturated fat and salt. Because it needs so much milk, cheese has a high footprint per kilogram.","Zahuštěné mléko: z asi 10 litrů mléka vznikne 1 kg tvrdého sýra, proto je bohatý na vápník a bílkoviny, ale i na nasycené tuky a sůl. Protože potřebuje tolik mléka, má sýr vysokou stopu na kilogram.",images/foods/cheese.jpg,C,635,30
Butter,Máslo,🧈,dairy,"Made by churning cream, the fatty part of milk: about 80 % fat, mostly saturated, with some vitamin A. Plant oils are a healthier everyday choice for cooking. Butter needs lots of milk, so its footprint per kilogram is very high.","Vyrábí se stloukáním smetany, tedy tučné části mléka: obsahuje asi 80 % tuku, většinou nasyceného, a trochu vitaminu A. Pro každodenní vaření jsou zdravější volbou rostlinné oleje. Máslo potřebuje hodně mléka, proto má na kilogram velmi vysokou stopu.",images/foods/butter.jpg,B,180,15
Pumpkin,Dýně,🎃,starchy,"Firm winter squash such as Hokkaido has more starch than most vegetables, which makes it filling, plus beta-carotene and fibre. It grows easily in Czechia and keeps for months without a fridge, so its footprint is low.","Pevné zimní dýně, například Hokkaido, obsahují víc škrobu než většina zeleniny, a proto dobře zasytí; mají také beta-karoten a vlákninu. V Česku se snadno pěstují a vydrží měsíce bez lednice, takže mají nízkou stopu.",images/foods/pumpkin.jpg,A,50,100
Parsnip,Pastinák,🥕,starchy,"A pale root related to carrot, but much starchier, so it gives more energy, plus fibre, potassium and vitamin C. It grows outdoors in cool climates and keeps through winter, so its footprint is low.","Světlý kořen příbuzný mrkvi, ale mnohem škrobovitější, takže dodá víc energie; obsahuje také vlákninu, draslík a vitamin C. Pěstuje se venku v chladnějším podnebí a vydrží přes zimu, takže má nízkou stopu.",images/foods/parsnip.jpg,A,30,80
Nutritional yeast,Lahůdkové droždí,🥄,plant,"Dried, inactive yeast flakes with a cheesy taste; about half of their weight is protein, and they are rich in B vitamins (often fortified with B12, important for vegans). Only a spoonful is used, so the footprint per portion is small.","Sušené neaktivní kvasnice ve vločkách se sýrovou chutí; zhruba polovinu jejich hmotnosti tvoří bílkoviny a jsou bohaté na vitaminy B (často obohacené o B12, důležitý pro vegany). Používá se jen lžíce, takže stopa na porci je malá.",images/foods/nutritional-yeast.jpg,A,30,10
Seitan,Seitan,🍢,plant,"Made from wheat gluten, the protein part of wheat flour, so it is very high in protein and is often used instead of meat. Not suitable for people with coeliac disease. Its footprint is far lower than meat.","Vyrábí se z lepku, tedy z bílkovinné části pšeničné mouky, proto obsahuje velmi mnoho bílkovin a často nahrazuje maso. Není vhodný pro lidi s celiakií. Jeho stopa je mnohem nižší než u masa.",images/foods/seitan.jpg,B,250,100
Tempeh,Tempeh,🟫,plant,"A firm cake of whole soybeans fermented by a mould, originally from Indonesia. High in protein and fibre, with iron and magnesium; fermentation makes it easier to digest. Much lower footprint than meat.","Pevný blok z celých sójových bobů fermentovaných plísní, původem z Indonésie. Obsahuje hodně bílkovin a vlákniny, také železo a hořčík; díky fermentaci je lépe stravitelný. Má mnohem nižší stopu než maso.",images/foods/tempeh.jpg,B,220,100
Spirulina,Spirulina,🌿,plant,"A blue-green microalga sold as powder: about 60 % of its dry weight is protein, and it contains iron. Its vitamin B12 is mostly a form the body cannot use. It needs almost no land, but its footprint depends on the energy used to grow it.","Modrozelená mikrořasa prodávaná jako prášek: asi 60 % její sušiny tvoří bílkoviny a obsahuje železo. Vitamin B12 v ní je ale většinou ve formě, kterou tělo nevyužije. Nepotřebuje skoro žádnou půdu, stopa však závisí na energii potřebné k pěstování.",images/foods/spirulina.jpg,A,25,5
Pumpkin seeds,Dýňová semínka,🌱,plant,"Seeds rich in protein, unsaturated fat, magnesium, zinc and iron; a handful makes a good snack or salad topping. Their footprint is much lower than animal protein.","Semínka bohatá na bílkoviny, nenasycené tuky, hořčík, zinek a železo; hrst je skvělá svačina nebo posyp salátu. Jejich stopa je mnohem nižší než u živočišných bílkovin.",images/foods/pumpkin-seeds.jpg,A,60,30
Button mushrooms,Žampióny,🍄,veg,"Mushrooms are fungi, not plants, but in your diet they count as vegetables: few calories, fibre, B vitamins and potassium; under sunlight or UV light they even make vitamin D. They grow indoors on compost from farm waste and need very little land.","Houby nejsou rostliny, ve stravě se ale počítají k zelenině: málo kalorií, vláknina, vitaminy B a draslík; na slunci nebo pod UV světlem si dokonce vytvoří vitamin D. Pěstují se uvnitř na kompostu ze zemědělských zbytků a potřebují velmi málo půdy.",images/foods/button-mushrooms.jpg,A,120,80
Shiitake,Shiitake,🍄‍🟫,veg,"An Asian mushroom with a rich, savoury (umami) taste. Like other mushrooms it counts as a vegetable: low in calories, with fibre and B vitamins. It grows on logs or sawdust from wood waste; dried imported shiitake travel far.","Asijská houba s výraznou, plnou (umami) chutí. Jako jiné houby se počítá k zelenině: málo kalorií, vláknina a vitaminy B. Roste na kmenech nebo pilinách z dřevního odpadu; sušené dovážené shiitake ale cestují zdaleka.",images/foods/shiitake.jpg,B,160,80
Chips,Chipsy,🍟,sugarsalt,"Thin potato slices fried in oil and heavily salted – frying and salt turn a potato into a fatty, salty snack. A large bag can hold a big part of the daily salt limit (5 g). The impact comes from frying oil, energy and packaging.","Tenké plátky brambor smažené v oleji a silně osolené – smažení a sůl udělají z brambory tučnou a slanou pochutinu. Velký sáček může obsahovat značnou část denního limitu soli (5 g). Dopad souvisí s olejem na smažení, energií a obaly.",images/foods/chips.jpg,A,120,30

    /* =====================================================================
       6. GAME CODE  (no need to edit below to change sizes or fonts)
       ===================================================================== */
    const SVG_NS = "http://www.w3.org/2000/svg";
    const $ = (id) => document.getElementById(id);

    const R = CONFIG.wheelRadius;
    const CX = CONFIG.marginX + R;
    const CY = CONFIG.marginY + R;

    let FOODS = [];           // filled from the CSV by loadFoods()
    let pool = [];            // foods still waiting on the right
    let placed = {};          // categoryId -> foods already on the plate
    let selectedId = null;    // food picked by tap/click
    let mistakes = 0;
    let clickTimer = null;

    /* ---------- CSV ---------- */
    // minimal CSV parser: handles "quoted, values", doubled quotes and line breaks
    function parseCsv(text) {
      const rows = [];
      let row = [], cell = "", quoted = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (quoted) {
          if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
          else if (ch === '"') quoted = false;
          else cell += ch;
        } else if (ch === '"') quoted = true;
        else if (ch === ",") { row.push(cell); cell = ""; }
        else if (ch === "\n" || ch === "\r") {
          if (ch === "\r" && text[i + 1] === "\n") i++;
          row.push(cell); rows.push(row); row = []; cell = "";
        } else cell += ch;
      }
      if (cell || row.length) { row.push(cell); rows.push(row); }
      const [header, ...body] = rows.filter((r) => r.some((c) => c.trim()));
      return body.map((r) => Object.fromEntries(header.map((h, i) => [h.trim(), (r[i] || "").trim()])));
    }

    // CSV text -> FOODS (each food keeps its whole CSV row in `row`)
    function loadFoods(csvText) {
      FOODS = parseCsv(csvText.replace(/^\uFEFF/, "")).map((row, i) => ({
        id: "food" + i, name: row.name, emoji: row.emoji, category: row.category,
        image: row.wikipedia_image_url, row,
      }));
      FOODS.forEach((f) => {
        if (!CATEGORIES.some((c) => c.id === f.category)) console.warn(`Unknown category "${f.category}" for ${f.name}`);
      });
    }

    /* ---------- geometry helpers ---------- */
    // angle 0 = top, increasing clockwise
    function polar(radius, deg) {
      const rad = (deg - 90) * Math.PI / 180;
      return { x: CX + radius * Math.cos(rad), y: CY + radius * Math.sin(rad) };
    }
    function wedgePath(startDeg, endDeg) {
      const a = polar(R, startDeg), b = polar(R, endDeg);
      const large = endDeg - startDeg > 180 ? 1 : 0;
      return `M ${CX} ${CY} L ${a.x} ${a.y} A ${R} ${R} 0 ${large} 1 ${b.x} ${b.y} Z`;
    }
    function svgEl(tag, attrs = {}, parent) {
      const el = document.createElementNS(SVG_NS, tag);
      for (const k in attrs) el.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(el);
      return el;
    }

    /* ---------- compute section angles ---------- */
    const totalDegrees = CATEGORIES.reduce((sum, c) => sum + c.degrees, 0);
    let cursor = CONFIG.startAngle;
    CATEGORIES.forEach((c) => {
      c.start = cursor;
      c.end = cursor + c.degrees * 360 / totalDegrees;
      c.mid = (c.start + c.end) / 2;
      cursor = c.end;
    });

    /* ---------- draw the static wheel ---------- */
    const svg = $("wheel");
    svg.setAttribute("viewBox", `0 0 ${2 * CX} ${2 * CY}`);

    /* ---------- the plate (drawn under and over the food sections) ---------- */
    // gradient helper: stops = [[offset 0–1, css colour], ...]
    function radialGradient(defs, id, radius, stops) {
      const g = svgEl("radialGradient", { id, cx: CX, cy: CY, r: radius, gradientUnits: "userSpaceOnUse" }, defs);
      stops.forEach(([offset, color]) => svgEl("stop", { offset, style: `stop-color:${color}` }, g));
    }

    // under the food: shadow, rim, the step into the well
    function drawPlate() {
      const rim = R + CONFIG.plateRim;
      const defs = svgEl("defs", {}, svg);

      // soft shadow under the plate
      const blur = svgEl("filter", { id: "plateBlur", x: "-20%", y: "-20%", width: "140%", height: "140%" }, defs);
      svgEl("feGaussianBlur", { stdDeviation: 9 }, blur);
      svgEl("circle", { cx: CX, cy: CY + 10, r: rim, fill: "#000", opacity: CONFIG.plateShadow, filter: "url(#plateBlur)" }, svg);

      // rim: light, getting darker towards the outer edge
      radialGradient(defs, "plateRimGrad", rim, [[0, "var(--plate)"], [0.9, "var(--plate)"], [1, "var(--plate-edge)"]]);
      svgEl("circle", { cx: CX, cy: CY, r: rim, fill: "url(#plateRimGrad)" }, svg);

      // the step from the rim down into the well (a light line + a dark line)
      svgEl("circle", { cx: CX, cy: CY, r: R + 6, fill: "none", stroke: "#fff", "stroke-width": 1.5, opacity: 0.8 }, svg);
      svgEl("circle", { cx: CX, cy: CY, r: R + 4, fill: "var(--plate-well)", stroke: "var(--plate-edge)", "stroke-width": 1.5 }, svg);
    }

    // over the food: shading towards the edge of the well + a light reflection on the rim
    function drawPlateShading() {
      const defs = svg.querySelector("defs");
      radialGradient(defs, "plateWellShade", R, [[0, "rgba(0,0,0,0)"], [0.82, "rgba(0,0,0,0)"], [1, "rgba(0,0,0,0.22)"]]);
      svgEl("circle", { cx: CX, cy: CY, r: R, fill: "url(#plateWellShade)", "pointer-events": "none" }, svg);

      if (CONFIG.plateGloss) {
        const r = R + CONFIG.plateRim * 0.55;
        const a = polar(r, -70), b = polar(r, -15);   // arc on the upper left of the rim
        svgEl("path", {
          d: `M ${a.x} ${a.y} A ${r} ${r} 0 0 1 ${b.x} ${b.y}`, fill: "none",
          stroke: "#fff", "stroke-width": CONFIG.plateRim * 0.25, "stroke-linecap": "round", opacity: 0.7, "pointer-events": "none",
        }, svg);
      }
    }


    function buildWheel() {
      svg.innerHTML = "";
      drawPlate();

      CATEGORIES.forEach((c) => {
        const path = svgEl("path", {
          d: wedgePath(c.start, c.end), fill: c.color, class: "wedge",
          stroke: "var(--plate)", "stroke-width": CONFIG.dividerWidth, "stroke-linejoin": "round",
        }, svg);
        c.el = path;
        path.addEventListener("dragover", (e) => { e.preventDefault(); path.classList.add("hover"); });
        path.addEventListener("dragleave", () => path.classList.remove("hover"));
        path.addEventListener("drop", (e) => {
          e.preventDefault(); path.classList.remove("hover");
          tryPlace(e.dataTransfer.getData("text/plain"), c);
        });
        path.addEventListener("click", () => {   // wait briefly, so a double-click doesn't also place a food
          clearTimeout(clickTimer);
          clickTimer = setTimeout(() => { if (selectedId) tryPlace(selectedId, c); }, CONFIG.doubleClickDelay);
        });
        path.addEventListener("dblclick", () => { clearTimeout(clickTimer); openGroupPopup(c); });
      });

      drawPlateShading();
      CATEGORIES.forEach(drawLabel);
      if (CONFIG.showPlacedFoods) CATEGORIES.forEach(drawPlaced);
    }

    function drawLabel(c) {

      if (c.id == "starchy") {
        CONFIG.labelDistance = CONFIG.labelDistance + 10
      }

      const edge = polar(R + CONFIG.plateRim, c.mid);                       // where the line starts (plate edge)
      const end = polar(R + CONFIG.plateRim + CONFIG.labelDistance, c.mid); // where the line ends (label)
      const side = Math.sin(c.mid * Math.PI / 180);   // > 0 right side, < 0 left side
      const vert = Math.cos(c.mid * Math.PI / 180);   // > 0 top, < 0 bottom
      const anchor = side > 0.3 ? "start" : side < -0.3 ? "end" : "middle";

      if (CONFIG.showLeaderLines) {
        svgEl("line", {
          x1: edge.x, y1: edge.y, x2: end.x, y2: end.y,
          stroke: "var(--muted)", "stroke-width": CONFIG.leaderLineWidth, "stroke-linecap": "round"
        }, svg);
      }

      // the label is an HTML box (foreignObject) filled from the template
      const pad = CONFIG.showLeaderLines ? CONFIG.labelPadding : 0;
      const W = CONFIG.labelWidth, H = CONFIG.labelHeight;
      let x, y, align, justify, textAlign;   // box position + how the content sits inside it
      if (anchor === "start") { x = end.x + pad; y = end.y - H / 2; align = "flex-start"; justify = "center"; textAlign = "left"; }
      else if (anchor === "end") { x = end.x - pad - W; y = end.y - H / 2; align = "flex-end"; justify = "center"; textAlign = "right"; }
      else if (vert < 0) { x = end.x - W / 2; y = end.y + pad; align = "center"; justify = "flex-start"; textAlign = "center"; } // below the plate
      else { x = end.x - W / 2; y = end.y - pad - H; align = "center"; justify = "flex-end"; textAlign = "center"; } // above the plate

      const data = { id: c.id, label: tr(c.label), hint: CONFIG.showHints ? tr(c.hint || "") : "" };
      const template = c.template || CONFIG.labelTemplate;
      const html = template.replace(/\{(\w+)\}/g, (_, key) => data[key] ?? "");

      const box = svgEl("foreignObject", { x, y, width: W, height: H, class: "label-object" }, svg);
      box.innerHTML = `<div class="label-wrap" style="align-items:${align}; justify-content:${justify}; text-align:${textAlign}">${html}</div>`;

      if (c.id == "starchy") {
        CONFIG.labelDistance = CONFIG.labelDistance - 10
      }

    }

    function drawPlaced(c) {
      const span = c.end - c.start;
      const columns = span >= CONFIG.twoColumnsAbove ? 2 : 1;
      const items = placed[c.id] || [];
      // full icon size comes from --font-placed-icon in the CSS
      const base = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--font-placed-icon")) || 24;
      let radius = R * CONFIG.placedStartRadius;
      for (let i = 0; i < items.length; i += columns) {
        // width of one slot at this distance from the centre -> shrink icon to fit narrow sections
        const slotWidth = (span / columns) * Math.PI / 180 * radius * CONFIG.placedFill;
        const size = Math.max(base * CONFIG.placedMinScale, Math.min(base, slotWidth));
        items.slice(i, i + columns).forEach((food, col) => {
          const offset = columns === 2 ? (col ? 1 : -1) * span * 0.22 : 0;
          const p = polar(radius, c.mid + offset);
          const t = svgEl("text", { x: p.x, y: p.y, "text-anchor": "middle", "dominant-baseline": "central", class: "placed", style: `font-size:${size}px` }, svg);
          t.textContent = food.emoji;
          const title = svgEl("title", {}, t); title.textContent = foodName(food);
        });
        // smaller icons -> rows packed closer together
        radius = Math.max(R * 0.2, radius - R * CONFIG.placedRowStep * (size / base));
      }
    }

    /* ---------- pool of foods ---------- */
    function renderPool() {
      const el = $("pool");
      el.innerHTML = "";
      pool.forEach((food) => {
        const card = document.createElement("button");
        card.className = "card" + (food.id === selectedId ? " selected" : "");
        card.draggable = true;
        card.dataset.id = food.id;
        card.innerHTML = `<span class="icon">${food.emoji}</span><span class="name">${esc(foodName(food))}</span>`;
        card.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", food.id); select(food.id); });
        card.addEventListener("click", () => select(food.id === selectedId ? null : food.id));
        card.addEventListener("dblclick", () => openFoodPopup(food));
        el.appendChild(card);
      });
      $("placedCount").textContent = FOODS.length - pool.length;
      $("totalCount").textContent = FOODS.length;
      $("mistakes").textContent = mistakes;
    }

    function select(id) {
      selectedId = id;
      document.querySelectorAll(".card").forEach((c) => c.classList.toggle("selected", c.dataset.id === id));
    }

    function say(text, kind = "") { const m = $("message"); m.textContent = text; m.className = kind; }

    function flash(el, cls) { el.classList.remove(cls); void el.getBBox(); el.classList.add(cls); }

    /* ---------- answer feedback: sounds (Web Audio, no files needed) ---------- */
    let audioCtx = null;
    function tone(freq, start, duration, type = "sine", volume = 0.2, slideTo = null) {
      try {
        audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const t0 = audioCtx.currentTime + start;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t0);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + duration);
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(volume, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t0); osc.stop(t0 + duration + 0.05);
      } catch (e) { /* no audio available – the game works without it */ }
    }
    const sounds = {
      // bright rising two-note chime
      correct() { tone(660, 0, 0.18, "triangle"); tone(990, 0.1, 0.3, "triangle"); },
      // low descending buzz
      wrong() { tone(220, 0, 0.35, "square", 0.08, 140); },
      // short victory fanfare
      won() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.13, i === 3 ? 0.6 : 0.2, "triangle")); },
    };

    /* ---------- answer feedback: confetti particles ---------- */
    const confetti = { canvas: null, ctx: null, parts: [], running: false };
    const CONFETTI_COLORS = ["#e74c3c", "#f1c40f", "#2ecc71", "#3498db", "#9b59b6", "#ff8c42", "#ff6fb5"];
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function burstConfetti(x, y, count = 60, power = 9) {
      if (reducedMotion) count = Math.round(count / 4);
      if (!confetti.canvas) {
        confetti.canvas = document.createElement("canvas");
        confetti.canvas.id = "confetti";
        document.body.appendChild(confetti.canvas);
        confetti.ctx = confetti.canvas.getContext("2d");
      }
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = power * (0.4 + Math.random() * 0.8);
        confetti.parts.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - power * 0.6,      // bias upwards
          size: 6 + Math.random() * 6,
          rot: Math.random() * Math.PI, spin: (Math.random() - 0.5) * 0.4,
          color: CONFETTI_COLORS[(Math.random() * CONFETTI_COLORS.length) | 0],
          round: Math.random() < 0.3,
          life: 0, maxLife: 90 + Math.random() * 50,
        });
      }
      if (!confetti.running) { confetti.running = true; requestAnimationFrame(stepConfetti); }
    }

    function stepConfetti() {
      const { canvas, ctx } = confetti;
      const dpr = window.devicePixelRatio || 1;
      if (canvas.width !== innerWidth * dpr || canvas.height !== innerHeight * dpr) {
        canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      confetti.parts = confetti.parts.filter((p) => p.life < p.maxLife && p.y < innerHeight + 40);
      for (const p of confetti.parts) {
        p.life++;
        p.vy += 0.25;                 // gravity
        p.vx *= 0.98; p.vy *= 0.98;   // air drag
        p.x += p.vx; p.y += p.vy; p.rot += p.spin;
        ctx.save();
        ctx.globalAlpha = Math.min(1, (p.maxLife - p.life) / 25);
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.size / 2.5, 0, Math.PI * 2); ctx.fill(); }
        else ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);  // paper strip; spin fakes 3D
        ctx.restore();
      }
      if (confetti.parts.length) requestAnimationFrame(stepConfetti);
      else { confetti.running = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
    }

    // centre of an SVG element on screen (where the confetti starts)
    function screenCenter(el) {
      const r = el.getBoundingClientRect();
      return [r.left + r.width / 2, r.top + r.height / 2];
    }

    /* ---------- placing a food ---------- */
    function tryPlace(foodId, category) {
      const food = pool.find((f) => f.id === foodId);
      if (!food) return;

      if (food.category === category.id) {
        const [cx, cy] = screenCenter(category.el);   // measure before the wheel is rebuilt
        pool = pool.filter((f) => f.id !== foodId);
        (placed[category.id] ||= []).push(food);
        selectedId = null;
        flash(category.el, "flash-good");
        buildWheel(); renderPool();
        say(pool.length ? ui().correct(foodName(food), tr(category.label)) : ui().won(mistakes), "good");
        if (pool.length) {
          sounds.correct();
          burstConfetti(cx, cy);
        } else {
          // plate complete – big celebration from several points
          sounds.won();
          burstConfetti(cx, cy, 120, 12);
          [0.2, 0.5, 0.8].forEach((fx, i) =>
            setTimeout(() => burstConfetti(innerWidth * fx, innerHeight * 0.35, 80, 11), 250 + i * 250));
        }
      } else {
        mistakes++;
        sounds.wrong();
        flash(category.el, "flash-bad");
        const card = document.querySelector(`.card[data-id="${foodId}"]`);
        if (card) { card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); }
        $("mistakes").textContent = mistakes;
        say(ui().wrong(foodName(food), tr(category.label)), "bad");
      }
    }

    /* ---------- info popups ---------- */
    const esc = (s) => s.replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
    const fill = (template, data) => template.replace(/\{(\w+)\}/g, (_, key) => data[key] ?? "");

    function openPopup(html) { $("popupBody").innerHTML = html; $("popup").showModal(); }

    // Wikipedia "Special:Redirect/file" links accept ?width= to return a smaller picture
    function photoUrl(url) {
      return url + (url.includes("?") ? "&" : "?") + "width=" + CONFIG.popupImageWidth;
    }

    function openFoodPopup(food) {
      const info = foodInfo(food);
      const picture = food.image
        ? `<img class="popup-photo" src="${esc(photoUrl(food.image))}" alt="${esc(foodName(food))}" referrerpolicy="no-referrer">`
        : `<div class="popup-icon">${food.emoji}</div>`;
      openPopup(`<div class="popup-food">${picture}<h2>${esc(foodName(food))}</h2>${info ? `<p>${esc(info)}</p>` : ""}${climateHtml(food)}</div>`);

      // if the photo can't be loaded, show the emoji instead
      const img = $("popupBody").querySelector(".popup-photo");
      if (img) img.addEventListener("error", () => {
        img.outerHTML = `<div class="popup-icon">${food.emoji}</div>`;
      });
    }

    const CLIMATE_TEXT = {
      en: { label: "Climate", perPortion: "per portion", portion: "portion" },
      cs: { label: "Klima", perPortion: "na porci", portion: "porce" },
    };

    // bottom part of the food popup: class badge + CO2e + portion size (from the CSV columns)
    function climateHtml(food) {
      const cls = (food.row.climate_class || "").toUpperCase();
      if (!/^[A-E]$/.test(cls)) return "";
      const t = CLIMATE_TEXT[currentLang] || CLIMATE_TEXT.en;
      const co2 = esc(food.row.climate_co2_g || ""), portion = esc(food.row.portion_g || "");
      return `
    <div class="climate">
      <span class="climate-badge class-${cls.toLowerCase()}">${cls}</span>
      <span class="climate-label"><b>${t.label}</b>${co2 ? ` · ≈ ${co2} g CO₂e ${t.perPortion}` : ""} (${portion} g)</span>
    </div>
    ${portion ? `<div class="portion">${t.portion} ${portion} g</div>` : ""}`;
    }

    function openGroupPopup(c) {
      const entry = GROUP_INFO[c.id] || {};
      const template = entry[currentLang] || entry.en || "<h2>{label}</h2><p>{hint}</p>";
      openPopup(fill(template, {
        id: c.id, label: tr(c.label), hint: tr(c.hint || ""), color: c.color,
        source: GROUP_SOURCE[currentLang] || GROUP_SOURCE.en,
      }));
    }

    // close with the X button or by clicking the dark background (Esc works automatically)
    $("popup").addEventListener("click", (e) => {
      if (e.target === e.currentTarget || e.target.closest(".popup-close")) e.currentTarget.close();
    });

    $("infoBtn").addEventListener("click", () => {
      openPopup(renderTutorial(TUTORIAL_INFO[currentLang] || TUTORIAL_INFO.en));
    });

    /* ---------- start / restart ---------- */
    function newGame() {
      pool = [...FOODS].sort(() => Math.random() - 0.5);
      placed = {}; mistakes = 0; selectedId = null;
      say(ui().intro);
      buildWheel(); renderPool();
    }

    async function start() {
      let csvText = FOODS_CSV;
      if (CONFIG.csvUrl) {
        try {
          const response = await fetch(CONFIG.csvUrl);
          if (!response.ok) throw new Error(response.status);
          csvText = await response.text();
        } catch (err) {
          console.warn(`Could not load ${CONFIG.csvUrl}, using the embedded CSV instead.`, err);
        }
      }
      loadFoods(csvText);
      applyStaticText();
      newGame(); $
    }

    $("restart").addEventListener("click", newGame);
    document.querySelectorAll(".lang button").forEach((b) =>
      b.addEventListener("click", () => setLanguage(b.dataset.lang)));
    start();
  </script>
</body>

</html>
